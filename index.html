<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakerz Bite - Fresh Every Day</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top bg-white shadow-sm py-3">
<div class="container">
<a class="navbar-brand fw-bold logo" href="index.html">BAKERZ <span>BITE</span></a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav">
<div class="mx-auto my-2 my-lg-0" style="width:320px"><div class="input-group bg-light rounded-pill border"><span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span><input id="searchInput" class="form-control bg-transparent border-0" placeholder="Search cakes..."></div></div>
<ul class="navbar-nav ms-auto gap-2">
<li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
<li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
<a href="login.html" class="btn rounded-pill px-4" style="border:1px solid #f0e0d0">
  <i class="bi bi-person"></i> Login
</a>
<li class="nav-item"><button class="btn btn-dark rounded-pill px-4" data-bs-toggle="offcanvas" data-bs-target="#cart"><i class="bi bi-bag"></i> Cart <span id="cartCount" class="badge bg-warning text-dark ms-1">0</span></button></li>
</ul></div></div></nav>

<div class="container mt-4">
<div id="hero" class="carousel slide" data-bs-ride="carousel"><div class="carousel-inner rounded-5">
<div class="carousel-item active"><img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=1200" style="height:400px;object-fit:cover" class="w-100"><div class="carousel-caption text-start"><h2 class="fw-bold bg-white text-dark d-inline-block p-2 rounded-3">Fresh Cakes Daily</h2></div></div>
<div class="carousel-item"><img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?w=1200" style="height:400px;object-fit:cover" class="w-100"></div>
<div class="carousel-item"><img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=1200" style="height:400px;object-fit:cover" class="w-100"></div>
</div><button class="carousel-control-prev" data-bs-target="#hero" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button><button class="carousel-control-next" data-bs-target="#hero" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button></div>
</div>

<section class="container mt-5" id="products">
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><h4 class="fw-bold">Our Menu <small id="countText" class="text-muted fw-normal">(24)</small></h4><div class="d-flex gap-2 flex-wrap"><button class="btn btn-sm rounded-pill cat-btn active" data-cat="all">All</button><button class="btn btn-sm rounded-pill cat-btn" data-cat="cakes">Cakes</button><button class="btn btn-sm rounded-pill cat-btn" data-cat="pastries">Pastries</button><button class="btn btn-sm rounded-pill cat-btn" data-cat="savory">Savory</button><button class="btn btn-sm rounded-pill cat-btn" data-cat="donuts">Donuts</button></div></div>
<div class="row g-3 mt-3" id="productGrid"></div>
<nav class="d-flex justify-content-center mt-5"><ul class="pagination" id="pagination"></ul></nav>
</section>

<div class="offcanvas offcanvas-end" id="cart"><div class="offcanvas-header"><h5 class="fw-bold">Your Cart</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body"><div id="cartItems"></div><hr><div class="d-flex justify-content-between fw-bold"><span>Total</span><span>Rs. <span id="cartTotal">0</span></span></div><button id="checkoutBtn" class="btn btn-dark w-100 rounded-pill mt-3">Checkout COD</button></div></div>

<footer class="mt-5 py-5 text-center" style="background:#3e2723;color:#ffe0b2;border-radius:50px 50px 0 0"><h3 class="fw-bold">BAKERZ BITE</h3><p>Gulshan, Karachi - 0300-1234567</p></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
